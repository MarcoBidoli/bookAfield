name: bidoli-bookafield-webapplicationprogramming
services:
  app:
    container_name: bidoli-bookafield-app
    image: bookafield-app
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./app:/usr/src/app
      - docker_node_modules:/usr/src/app/node_modules

  mongo:
    container_name: bidoli-bookafield-mongo
    image: mongo
    ports:
      - "27017:27017"
    volumes:
      - bidoli-bookafield-data:/data/db

volumes:
  docker_node_modules:
  bidoli-bookafield-data:
    name: bidoli-bookafield-data